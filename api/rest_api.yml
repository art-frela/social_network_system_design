  /media:
    post:
      operationId: uploadMediaFiles
      tags:
        - Media
      summary: Upload multiple files
      description: Upload files and get URLs for use in other endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
            encoding:
              files:
                contentType: image/jpeg, image/png, image/gif
      responses:
        '201':
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
                required:
                  - files
              examples:
                mediaUploaded:
                  summary: Example of uploaded media
                  value:
                    files:
                      - id: "220e8400-e29b-41d4-a716-446655440002"
                        link: "https://storage.travelers-network.com/photos/123.jpg"
        default:
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorExample:
                  summary: Example error response
                  value:
                    code: 413
                    message: "File size exceeds maximum allowed size"